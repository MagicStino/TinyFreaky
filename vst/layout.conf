style=dark
[tab Oscillator]
readout cx=480 cy=80 w=900 h=40 label="Prototype status" key=status
knob cx=130 cy=190 r=42 label="Preset" key=preset
knob cx=350 cy=190 r=42 label="Master" key=master
knob cx=570 cy=190 r=42 label="Paraphonic" key=paraphonic
knob cx=790 cy=190 r=42 label="Model" key=osc_type
knob cx=130 cy=340 r=42 label="Wave" key=osc_wave
knob cx=350 cy=340 r=42 label="Timbre" key=osc_timbre
knob cx=570 cy=340 r=42 label="Shape" key=osc_shape
knob cx=790 cy=340 r=42 label="Glide" key=glide
qlinks "Oscillator" = preset, master, paraphonic, osc_type, osc_wave, osc_timbre, osc_shape, glide
[tab Filter and envelope]
knob cx=130 cy=190 r=42 label="Filter mode" key=filter_type
knob cx=350 cy=190 r=42 label="Cutoff" key=cutoff
knob cx=570 cy=190 r=42 label="Resonance" key=resonance
knob cx=790 cy=190 r=42 label="Filter amount" key=filter_amount
knob cx=130 cy=340 r=42 label="Attack" key=attack
knob cx=350 cy=340 r=42 label="Decay / Release" key=decay
knob cx=570 cy=340 r=42 label="Sustain" key=sustain
knob cx=790 cy=340 r=42 label="Amp envelope" key=amp_mod
qlinks "Filter and envelope" = filter_type, cutoff, resonance, filter_amount, attack, decay, sustain, amp_mod
[tab Modulators]
knob cx=130 cy=190 r=42 label="LFO shape" key=lfo_shape
knob cx=350 cy=190 r=42 label="LFO Hz" key=lfo_rate_free
knob cx=570 cy=190 r=42 label="LFO sync" key=lfo_sync
knob cx=790 cy=190 r=42 label="LFO division" key=lfo_rate_sync
knob cx=130 cy=340 r=42 label="Cycling mode" key=cyc_mode
knob cx=350 cy=340 r=42 label="Rise" key=cyc_rise
knob cx=570 cy=340 r=42 label="Fall" key=cyc_fall
knob cx=790 cy=340 r=42 label="Hold / Sustain" key=cyc_hold
knob cx=130 cy=490 r=42 label="Amount" key=cyc_amount
knob cx=350 cy=490 r=42 label="Rise curve" key=cyc_rise_curve
knob cx=570 cy=490 r=42 label="Fall curve" key=cyc_fall_curve
knob cx=790 cy=490 r=42 label="Tempo" key=tempo
qlinks "Modulators" = lfo_shape, lfo_rate_free, lfo_sync, lfo_rate_sync, cyc_mode, cyc_rise, cyc_fall, cyc_hold, cyc_amount, cyc_rise_curve, cyc_fall_curve, tempo
[tab Performance]
knob cx=130 cy=190 r=42 label="Hold" key=hold
knob cx=350 cy=190 r=42 label="Bend semitones" key=bend_range
knob cx=570 cy=190 r=42 label="Octave" key=octave
knob cx=790 cy=190 r=42 label="All notes off" key=all_notes_off
