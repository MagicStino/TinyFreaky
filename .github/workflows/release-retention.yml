name: Keep the two current TinyFreaky releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-retention.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Require complete downloads and a live current catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/v0.3.8" > release.json
          python3 - <<'PY'
          import json,urllib.request
          r=json.load(open('release.json'))
          names={a['name'] for a in r['assets']}
          expected={f'Tinyfreaky-0.3.8-{p}.zip' for p in ['Windows-VST3','macOS-VST3','Linux-VST3','macOS-AU','mpc-armv7']}
          assert expected<=names,expected-names
          d=json.loads(urllib.request.urlopen('https://magicstino.github.io/force-openplugin/catalog.json',timeout=30).read())
          p=next(p for p in d['plugins'] if p['id']=='tinyfreaky')
          assert p['repo']=='MagicStino/TinyFreaky' and p['versions'][0]['version']=='0.3.8'
          assert '/v0.3.8/' in p['screenshot']
          print('Complete 0.3.8 downloads and current public catalog verified')
          PY
      - name: Remove superseded releases and their version tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in v0.1.0 v0.1.1 v0.2.0-preview.1 v0.2.1-preview.1 v0.2.2-preview.1 v0.3.0-preview.1 v0.3.1-preview.1 v0.3.2-preview.1 v0.3.3-preview.1 v0.3.3 v0.3.4 v0.3.5 v0.3.6; do
            if gh release view "$tag" >/dev/null 2>&1; then gh release delete "$tag" --yes --cleanup-tag; fi
          done
          gh release list --limit 20 --json tagName,isDraft > retained.json
          python3 - <<'PY'
          import json
          tags={r['tagName'] for r in json.load(open('retained.json')) if not r['isDraft']}
          assert tags=={'v0.3.8','v0.3.7'},tags
          print('Only v0.3.8 and v0.3.7 retained')
          PY
