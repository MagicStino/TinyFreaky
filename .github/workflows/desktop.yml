name: Desktop VST3
on:
  push:
    paths: ['src/**', 'third_party/**', 'desktop/**', 'vst/params.json', 'tools/gen-desktop-params.py', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src/**', 'third_party/**', 'desktop/**', 'vst/params.json', 'tools/gen-desktop-params.py', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: SDK
        shell: bash
        run: |
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git -C "$RUNNER_TEMP/vst3sdk" checkout "$(cat desktop/SDK_REVISION)"
          git -C "$RUNNER_TEMP/vst3sdk" submodule update --init --recursive
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev libgtkmm-3.0-dev libsqlite3-dev libwayland-dev wayland-protocols libexpat1-dev
      - name: Configure
        shell: bash
        run: |
          python3 tools/gen-desktop-params.py
          if [[ "$RUNNER_OS" == macOS ]]; then
            cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk" "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            cmake -S desktop -B desktop/build -T ClangCL -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"
          else
            cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release -DVST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"
          fi
      - name: Build
        run: cmake --build desktop/build --config Release --parallel 2
      - name: Desktop smoke
        run: ctest --test-dir desktop/build -C Release --output-on-failure
      - name: Package shareable VST3
        shell: bash
        run: python3 tools/package-desktop.py --platform "${{ runner.os }}" --version 0.3.5
      - uses: actions/upload-artifact@v4
        with:
          name: Tinyfreaky-${{ runner.os }}-VST3
          path: dist/Tinyfreaky-0.3.5-*-VST3.zip

  publish:
    if: github.ref == 'refs/heads/tinyfreaky'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Tinyfreaky-*-VST3
          merge-multiple: true
          path: packages
      - name: Publish verified platform downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.3.5 || gh release create v0.3.5 --target "${{ github.sha }}" --title "Tinyfreaky 0.3.5" --notes "Eight-voice VST3 instrument with live output scope, modulation matrix, arp/swing and sequencer. Native platform builds passed the Steinberg validator and desktop smoke test. macOS includes Apple Silicon and Intel; the Mac build is ad-hoc signed, not notarized. Six engine families and exact original factory sound remain incomplete."
          gh release upload v0.3.5 packages/*.zip --clobber
