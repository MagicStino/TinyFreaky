name: Force ARMv7
on:
  push:
    branches: [tinyfreaky]
    paths: ['assets/**', 'src/**', 'vst/**', 'tools/**', '.github/workflows/force.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  force:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build prerequisites
        run: |
          python3 -m pip install Pillow jsonschema playwright==1.49.1
          python3 -m playwright install --with-deps chromium
          git clone https://github.com/sd88me/mpc-vst-plugins.git "$RUNNER_TEMP/mpc-vst-plugins"
          git -C "$RUNNER_TEMP/mpc-vst-plugins" checkout 3167a8df46c085f41277537eebaba4b8d6530ea0
      - name: Test independent engine and importer
        run: |
          python3 tools/test-engine.py
          python3 tests/test_import.py
          python3 tests/test_mascot_art.py
      - name: Test VST2 host contract
        run: ASAN_OPTIONS=detect_leaks=0 MPC_VST_TOOLS="$RUNNER_TEMP/mpc-vst-plugins" bash tools/test-force-host.sh
      - name: Build native plugin
        run: MPC_VST_TOOLS="$RUNNER_TEMP/mpc-vst-plugins" bash tools/build-force.sh
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then VERSION=0.4.0; fi
          python3 "$RUNNER_TEMP/mpc-vst-plugins/tools/release.py" --so vst/build/tinyfreaky.so --skin 'vst/build/skin/MagicStino - VST - Tinyfreaky' --entry vst/build/pluginlist-entry.xml --version "$VERSION" --id tinyfreaky --repo MagicStino/TinyFreaky --license MIT --user-data presets --extra docs:docs --extra THIRD_PARTY_NOTICES.md:THIRD_PARTY_NOTICES.md --about 'TinyFreaky eight-voice instrument. Six engine families remain unavailable; hardware playback still needs verification.' -o dist
          python3 tools/make-openplugin.py --package "dist/Tinyfreaky-$VERSION-mpc-armv7.zip" --version "$VERSION" --output dist/openplugin-0.4.0.json
          cp assets/tinyfreaky-artwork.png assets/force-readable-preview.png assets/mascot-velocity.gif dist/
          git archive --format=zip --prefix=TinyFreaky/ HEAD > "dist/Tinyfreaky-$VERSION-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Tinyfreaky-Force-ARMv7
          path: dist/*

  publish:
    if: github.ref == 'refs/heads/tinyfreaky'
    needs: force
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tinyfreaky-Force-ARMv7
          path: packages
      - name: Publish Force package and art
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.4.0 || gh release create v0.4.0 --draft --target "${{ github.sha }}" --title "TinyFreaky 0.4.0 — 8-voice synthesis by MagicStino" --notes "Sound-informed TinyFreaky preset names, 16 engines, eight voices, modulation matrix, arp/swing and sequencer. Slot IDs, patch settings and sound remain unchanged. macOS builds are ad-hoc signed, not notarized. Six engine families remain unavailable."
          gh release upload v0.4.0 packages/*.zip packages/*.png packages/*.gif packages/openplugin-0.4.0.json --clobber
