name: Force ARMv7
on:
  push:
    branches: [main, tinyfreaky, fix/qlink-automation]
    paths: ['assets/**', 'src/**', 'vst/**', 'tools/**', '.github/workflows/force.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  force:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build prerequisites
        run: |
          python3 -m pip install Pillow jsonschema playwright==1.49.1
          python3 -m playwright install --with-deps chromium
          git clone https://github.com/open-mpc/mpc-vst-plugins.git "$RUNNER_TEMP/mpc-vst-plugins"
          git -C "$RUNNER_TEMP/mpc-vst-plugins" checkout bf1054ce08460cf42b10f96985e73141d64a71af
      - name: Test independent engine and importer
        run: |
          python3 tools/test-engine.py
          python3 tests/test_import.py
          python3 tests/test_mascot_art.py
      - name: Test VST2 host contract
        run: ASAN_OPTIONS=detect_leaks=0 MPC_VST_TOOLS="$RUNNER_TEMP/mpc-vst-plugins" bash tools/test-force-host.sh
      - name: Build native plugin
        run: MPC_VST_TOOLS="$RUNNER_TEMP/mpc-vst-plugins" bash tools/build-force.sh
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then VERSION=0.4.2; fi
          python3 "$RUNNER_TEMP/mpc-vst-plugins/tools/release.py" --so vst/build/tinyfreaky.so --skin 'vst/build/skin/MagicStino - VST - Tinyfreaky' --entry vst/build/pluginlist-entry.xml --version "$VERSION" --id tinyfreaky --repo MagicStino/TinyFreaky --license MIT --user-data presets --extra docs:docs --extra THIRD_PARTY_NOTICES.md:THIRD_PARTY_NOTICES.md --about 'TinyFreaky eight-voice instrument. Six engine families remain unavailable; hardware playback still needs verification.' -o dist
          python3 tools/make-openplugin.py --package "dist/Tinyfreaky-$VERSION-mpc-armv7.zip" --version "$VERSION" --output dist/openplugin.json
          cp assets/tinyfreaky-artwork.png assets/force-readable-preview.png assets/mascot-velocity.gif dist/
          git archive --format=zip --prefix=TinyFreaky/ HEAD > "dist/Tinyfreaky-$VERSION-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Tinyfreaky-Force-ARMv7
          path: dist/*

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/qlink-automation'
    needs: force
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tinyfreaky-Force-ARMv7
          path: packages
      - name: Publish version 0.4.2 for Force testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.4.2 packages/* --target "$GITHUB_SHA" --title 'TinyFreaky 0.4.2' --notes 'Fix Q-Link automation screen redraws using the pinned open-mpc wrapper. Preserve 0.4.1 CPU optimizations and refresh oscillator labels when Model changes. Native ARMv7 build and automated host tests pass. Physical Force/MPC Q-Link automation validation is pending; this release is provided for device testing.'
          cp packages/openplugin.json openplugin.json
          cp packages/Tinyfreaky-0.4.2-mpc-armv7.zip .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add openplugin.json Tinyfreaky-0.4.2-mpc-armv7.zip
          git commit -m 'Add TinyFreaky 0.4.2 package and verified release manifest'
          git push origin HEAD:fix/qlink-automation
